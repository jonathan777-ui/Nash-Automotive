name = "orbit-command-center"
main = "src/index.ts"
compatibility_date = "2026-08-22"

# The login gate is a shared team password now, not Cloudflare Access (Access needs Zero Trust
# enabled on the account, which prompted for card details during setup — see ACCESS_PASSWORD/
# SESSION_SECRET below instead, both plain Wrangler secrets, not vars). This Worker still fails
# closed exactly the same way if those two secrets are unset - see verifySession in src/index.ts.
#
# CF_ACCOUNT_ID / CF_SECRETS_STORE_ID: not secrets, filled in during checkpoint 2 —
# see DEPLOY.md. CF_API_TOKEN is NOT here on purpose: it's the credential this Worker uses
# to write *other* credentials into Secrets Store, so it must be a plain Wrangler secret
# (`wrangler secret put CF_API_TOKEN`), never sitting in Secrets Store itself or in this
# plaintext config file.
#
# CF_API_TOKEN NEEDS ONE MORE SCOPE, new this pass: the credential wizard's push-to-n8n/Netlify
# feature (src/cfWorkerSecrets.ts) uses this SAME token to bind secrets directly onto this Worker's
# own script (Cloudflare's Workers Scripts API), which needs "Workers Scripts:Edit" permission in
# ADDITION to whatever Secrets Store scope it already had. If you created CF_API_TOKEN before this
# pass, edit it in the Cloudflare dashboard to add that permission rather than creating a second
# token - see DEPLOY.md.
[vars]
CF_ACCOUNT_ID = "739d34937ee1482e939d7c240189fabf"
CF_SECRETS_STORE_ID = "PLACEHOLDER_CLOUDFLARE_SECRETS_STORE_ID"
# Not a secret - the n8n instance's own base URL. New this pass (Tag-for-Action, 05 §14 Step 5):
# the only place this Worker itself calls OUT to n8n rather than only receiving pushes from it
# (POST {N8N_INSTANCE_URL}/webhook/tag-for-action). Same instance URL n8n's own workflow library
# already assumes exists (workflows/README.md's credential-naming section) - set once, real.
#
# ALSO used by the credential wizard's push-to-n8n feature (new this pass, src/pushTargets/) - the
# Instance URL was previously (wrongly) collected through the wizard's own "n8n" vendor form, which
# wrote it into Secrets Store where nothing ever read it back; fixed by moving it here instead,
# the one place this Worker's own code actually reads it from.
N8N_INSTANCE_URL = "PLACEHOLDER_N8N_INSTANCE_URL"
# Must match this file's own `name = "..."` at the top - used by the credential wizard's
# self-bind mechanism (src/cfWorkerSecrets.ts) to know which script to bind a secret onto. Not a
# secret itself, just has to stay in sync if this file's `name` ever changes.
CF_WORKER_SCRIPT_NAME = "orbit-command-center"

# Tracks per-vendor connection status (both CLI-auth confirmations and manual-paste writes) so
# the checklist survives across visits. Real ID, created directly in the account this Worker
# deploys to (dash.cloudflare.com → Workers & Pages → KV) — the value that was here before this
# pass belonged to a different Cloudflare account entirely (an earlier build session's own MCP
# tooling), which is why the first real deploy failed with "KV namespace ... not found."
[[kv_namespaces]]
binding = "STATUS"
id = "df97eb00985b42b9b45c7d4224cb10ab"

# Piece 2 — Internal Team Messaging (05 §14): channels/messages/@mentions, comment threads on CRM
# records, and in-app alert delivery. Real ID, created directly in the account this Worker deploys
# to (dash.cloudflare.com → D1 SQL Database) — same "different account" issue as STATUS above.
# Schema lives at schema.sql in this directory; load it into this database via its Console tab
# before relying on /messaging or /api/alerts.
[[d1_databases]]
binding = "MESSAGING_DB"
database_name = "orbit-command-center-messaging"
database_id = "2eb37b46-5f8a-42ba-939a-6ee0542ab536"

# ALERTS_INGEST_SECRET is NOT here on purpose, same reasoning as CF_API_TOKEN above: it's the
# shared secret n8n's alert-dispatcher workflow uses to authenticate to POST /api/alerts (a
# machine-to-machine route that can't go through the interactive login page), so it must be a
# plain Wrangler secret (`wrangler secret put ALERTS_INGEST_SECRET`) — generate a random value,
# put the same one in n8n's environment as ALERTS_INGEST_SECRET. Until it's set, /api/alerts
# rejects every request rather than silently accepting unauthenticated writes (see index.ts).
#
# ACCESS_PASSWORD / SESSION_SECRET are ALSO not here, same reasoning: run
#   wrangler secret put ACCESS_PASSWORD     (the one password your whole team signs in with)
#   wrangler secret put SESSION_SECRET      (a random value, e.g. `openssl rand -hex 32` — signs
#                                             the session cookie; rotating it logs everyone out)
# Until both are set, every route redirects to a login page that always rejects (fails closed,
# same discipline as everywhere else in this file) — see src/index.ts's verifySession.
