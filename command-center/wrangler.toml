name = "orbit-command-center"
main = "src/index.ts"
compatibility_date = "2026-08-22"

# Both of these are filled in AFTER you create the Cloudflare Access application
# that gates this Worker — see DEPLOY.md step 3. Neither is a secret; they're
# public identifiers Access itself uses to validate the JWT it attaches to
# every request. Deploying with the placeholder values below will make the
# Worker refuse every request (fails closed, per the placeholder discipline
# this project uses everywhere else) rather than silently run unauthenticated.
#
# CF_ACCOUNT_ID / CF_SECRETS_STORE_ID: also not secrets, filled in during checkpoint 2 —
# see DEPLOY.md. CF_API_TOKEN is NOT here on purpose: it's the credential this Worker uses
# to write *other* credentials into Secrets Store, so it must be a plain Wrangler secret
# (`wrangler secret put CF_API_TOKEN`), never sitting in Secrets Store itself or in this
# plaintext config file.
[vars]
TEAM_DOMAIN = "PLACEHOLDER_CLOUDFLARE_ACCESS_TEAM_DOMAIN"
POLICY_AUD = "PLACEHOLDER_CLOUDFLARE_ACCESS_APPLICATION_AUD"
CF_ACCOUNT_ID = "PLACEHOLDER_CLOUDFLARE_ACCOUNT_ID"
CF_SECRETS_STORE_ID = "PLACEHOLDER_CLOUDFLARE_SECRETS_STORE_ID"

# Tracks per-vendor connection status (both CLI-auth confirmations and manual-paste writes) so
# the checklist survives across visits. Actually provisioned already (via the Cloudflare MCP
# tools available in the build session) — this ID is real, not a placeholder.
[[kv_namespaces]]
binding = "STATUS"
id = "c2f4d507f9c64a77b3d7c28b4e4b83c9"
